  - id: nats-service-configuration
    appliesToKind: nats.service
    appliesToInterfaceType: service
    description: Validates NATS-owned environment configuration inputs.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        configuration:
          $ref: '#/$defs/configuration'
      $defs:
        configuration:
          type: object
          oneOf:
          - required:
            - env
            properties:
              env:
                $ref: '#/$defs/envList'
            additionalProperties: false
          - required:
            - alternatives
            properties:
              alternatives:
                type: array
                minItems: 2
                items:
                  type: object
                  required:
                  - env
                  properties:
                    env:
                      $ref: '#/$defs/envList'
                  additionalProperties: false
            additionalProperties: false
        envList:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/$defs/envInput'
        envInput:
          type: object
          required:
          - property
          - name
          properties:
            property:
              enum:
              - url
              - hostname
              - port
              - username
              - password
              - token
              - tls
              - stream
              - subject
              - consumer
            name:
              type: string
              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
            sensitive:
              type: boolean
            required:
              type: boolean
          additionalProperties: false

apiVersion: runtimeconditions.io/sdk-mapping/v1alpha1
kind: RuntimeConditionsSDKMapping
metadata:
  name: s3transfer.aws.s3
  distribution: s3transfer
  distributionVersion: 0.19.2
  language: python
  service: s3
  semanticSha256: 8882179e21c20092386581173251fab325f7b6616a6fd1ccc5c0be2dd3896217
dependencies:
- kind: sdkMapping
  distribution: botocore
  mapping: botocore.aws.s3
python:
  calls:
  - name: managed-upload
    entrypoints:
    - symbol: s3transfer.S3Transfer.upload_file
      receiverContext:
        constructor: s3transfer.S3Transfer
        arguments:
          config:
            position: 1
            keyword: config
      arguments:
        fileobj:
          position: 0
          keyword: filename
        bucket:
          position: 1
          keyword: bucket
        key:
          position: 2
          keyword: key
        extraArgs:
          position: 4
          keyword: extra_args
    - symbol: s3transfer.manager.TransferManager.upload
      receiverContext:
        constructor: s3transfer.manager.TransferManager
        arguments:
          config:
            position: 1
            keyword: config
      arguments:
        fileobj:
          position: 0
          keyword: fileobj
        bucket:
          position: 1
          keyword: bucket
        key:
          position: 2
          keyword: key
        extraArgs:
          position: 3
          keyword: extra_args
    - symbol: s3transfer.crt.CRTTransferManager.upload
      arguments:
        fileobj:
          position: 0
          keyword: fileobj
        bucket:
          position: 1
          keyword: bucket
        key:
          position: 2
          keyword: key
        extraArgs:
          position: 3
          keyword: extra_args
    arguments:
    - fileobj
    - bucket
    - key
    - extraArgs
    - config
    implementations:
    - name: classic
      selection: classic transfer manager selected by boto3 configuration and environment
      executionPaths:
      - name: single-part
        selection: transfer manager chooses a single request
        operationRefs:
        - usage: always-on-path
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: PutObject
      - name: multipart-success
        selection: transfer manager chooses multipart and completes successfully
        operationRefs:
        - usage: always-on-path
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: CreateMultipartUpload
        - usage: one-or-more
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: UploadPart
        - usage: always-on-path
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: CompleteMultipartUpload
      - name: multipart-abort
        selection: multipart transfer fails after creation and cleanup is attempted
        operationRefs:
        - usage: always-on-path
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: CreateMultipartUpload
        - usage: zero-or-more-before-failure
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: UploadPart
        - usage: failure-recovery
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: AbortMultipartUpload
    - name: crt
      operationRefs:
      - usage: managed-request
        inputBindings:
          Bucket: bucket
          Key: key
        operationRef:
          distribution: botocore
          mapping: botocore.aws.s3
          operation: PutObject
  - name: managed-download
    entrypoints:
    - symbol: s3transfer.S3Transfer.download_file
      receiverContext:
        constructor: s3transfer.S3Transfer
        arguments:
          config:
            position: 1
            keyword: config
      arguments:
        bucket:
          position: 0
          keyword: bucket
        key:
          position: 1
          keyword: key
        fileobj:
          position: 2
          keyword: filename
        extraArgs:
          position: 3
          keyword: extra_args
    - symbol: s3transfer.manager.TransferManager.download
      receiverContext:
        constructor: s3transfer.manager.TransferManager
        arguments:
          config:
            position: 1
            keyword: config
      arguments:
        bucket:
          position: 0
          keyword: bucket
        key:
          position: 1
          keyword: key
        fileobj:
          position: 2
          keyword: fileobj
        extraArgs:
          position: 3
          keyword: extra_args
    - symbol: s3transfer.crt.CRTTransferManager.download
      arguments:
        bucket:
          position: 0
          keyword: bucket
        key:
          position: 1
          keyword: key
        fileobj:
          position: 2
          keyword: fileobj
        extraArgs:
          position: 3
          keyword: extra_args
    arguments:
    - bucket
    - key
    - fileobj
    - extraArgs
    - config
    implementations:
    - name: classic
      operationRefs:
      - usage: metadata-discovery
        inputBindings:
          Bucket: bucket
          Key: key
        operationRef:
          distribution: botocore
          mapping: botocore.aws.s3
          operation: HeadObject
      - usage: always
        inputBindings:
          Bucket: bucket
          Key: key
        operationRef:
          distribution: botocore
          mapping: botocore.aws.s3
          operation: GetObject
    - name: crt
      operationRefs:
      - usage: managed-request
        inputBindings:
          Bucket: bucket
          Key: key
        operationRef:
          distribution: botocore
          mapping: botocore.aws.s3
          operation: GetObject
  - name: managed-copy
    entrypoints:
    - symbol: s3transfer.manager.TransferManager.copy
      receiverContext:
        constructor: s3transfer.manager.TransferManager
        arguments:
          config:
            position: 1
            keyword: config
      arguments:
        copySource:
          position: 0
          keyword: copy_source
        bucket:
          position: 1
          keyword: bucket
        key:
          position: 2
          keyword: key
        extraArgs:
          position: 3
          keyword: extra_args
        sourceClient:
          position: 5
          keyword: source_client
    arguments:
    - copySource
    - bucket
    - key
    - extraArgs
    - sourceClient
    - config
    implementations:
    - name: classic
      selection: copy is implemented only by the classic transfer manager
      commonOperationRefs:
      - usage: metadata-discovery
        inputBindings:
          Bucket: copySource.Bucket
          Key: copySource.Key
        operationRef:
          distribution: botocore
          mapping: botocore.aws.s3
          operation: HeadObject
      executionPaths:
      - name: single-request-success
        selection: source size is below the multipart copy threshold
        operationRefs:
        - usage: always-on-path
          inputBindings:
            Bucket: bucket
            Key: key
            CopySource: copySource
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: CopyObject
      - name: multipart-success
        selection: source size meets the multipart copy threshold and completion succeeds
        operationRefs:
        - usage: always-on-path
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: CreateMultipartUpload
        - usage: one-or-more
          inputBindings:
            Bucket: bucket
            Key: key
            CopySource: copySource
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: UploadPartCopy
        - usage: always-on-path
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: CompleteMultipartUpload
        - usage: conditional
          when:
            argument: extraArgs
            path: TaggingDirective
            equals: COPY
          inputBindings:
            Bucket: copySource.Bucket
            Key: copySource.Key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: GetObjectTagging
        - usage: conditional
          whenAll:
          - argument: extraArgs
            path: TaggingDirective
            in:
            - COPY
            - REPLACE
          - derived: resolved tag set is non-empty
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: PutObjectTagging
        - usage: conditional
          when:
            argument: extraArgs
            path: AnnotationDirective
            equals: COPY
          inputBindings:
            Bucket: copySource.Bucket
            Key: copySource.Key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: ListObjectAnnotations
        - usage: zero-or-more
          whenAll:
          - argument: extraArgs
            path: AnnotationDirective
            equals: COPY
          - derived: source annotation list is non-empty
          inputBindings:
            Bucket: copySource.Bucket
            Key: copySource.Key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: GetObjectAnnotation
        - usage: zero-or-more
          whenAll:
          - argument: extraArgs
            path: AnnotationDirective
            equals: COPY
          - derived: source annotation list is non-empty
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: PutObjectAnnotation
      - name: multipart-abort
        selection: multipart copy fails after creation and cleanup is attempted
        operationRefs:
        - usage: always-on-path
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: CreateMultipartUpload
        - usage: zero-or-more-before-failure
          inputBindings:
            Bucket: bucket
            Key: key
            CopySource: copySource
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: UploadPartCopy
        - usage: failure-recovery
          inputBindings:
            Bucket: bucket
            Key: key
          operationRef:
            distribution: botocore
            mapping: botocore.aws.s3
            operation: AbortMultipartUpload
  - name: managed-delete
    entrypoints:
    - symbol: s3transfer.manager.TransferManager.delete
      arguments:
        bucket:
          position: 0
          keyword: bucket
        key:
          position: 1
          keyword: key
        extraArgs:
          position: 2
          keyword: extra_args
    - symbol: s3transfer.crt.CRTTransferManager.delete
      arguments:
        bucket:
          position: 0
          keyword: bucket
        key:
          position: 1
          keyword: key
        extraArgs:
          position: 2
          keyword: extra_args
    arguments:
    - bucket
    - key
    - extraArgs
    implementations:
    - name: classic-or-crt
      operationRefs:
      - usage: always
        inputBindings:
          Bucket: bucket
          Key: key
        operationRef:
          distribution: botocore
          mapping: botocore.aws.s3
          operation: DeleteObject

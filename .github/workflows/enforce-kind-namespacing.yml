name: Enforce kind namespacing

on:
  pull_request:
    paths:
      - "catalog/**/releases/**/runtimeconditions.extension.yaml"
      - "tooling/common/check_kind_namespacing.py"
      - "tooling/common/serialization.py"
  push:
    branches:
      - main
    paths:
      - "catalog/**/releases/**/runtimeconditions.extension.yaml"
      - "tooling/common/check_kind_namespacing.py"
      - "tooling/common/serialization.py"

permissions:
  contents: read

jobs:
  check-namespacing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install prerequisites
        run: python -m pip install --disable-pip-version-check -r tooling/smithy-runtime-conditions/requirements.txt

      - name: Check kind namespacing
        run: python tooling/common/check_kind_namespacing.py

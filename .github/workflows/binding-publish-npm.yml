name: Publish TypeScript bindings

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated package-key:typescript targets, or all'
        type: string
        default: ''
      dry_run:
        description: 'Build and check the packages without publishing them to npm'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: binding-publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Trusted publishing: npm accepts this workflow's OIDC identity, so no npm token is stored.
      id-token: write
    env:
      INPUT_TARGETS: ${{ inputs.targets }}
      EXECUTE: ${{ !inputs.dry_run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for the publication helper
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'

      - name: Install the helper dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install the pinned emitter dependencies, which provide the TypeScript compiler
        working-directory: tooling/extension-bindings/emitters/typescript
        run: npm ci --ignore-scripts

      - name: Test the publication helper
        run: python -m unittest discover -s tooling/extension-bindings/ci -p 'test_publish_npm.py'

      - name: Build and check the committed packages, then publish them
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$EXECUTE" == true ]]; then
            args+=(--execute)
          fi
          python tooling/extension-bindings/ci/publish-npm.py --targets "$INPUT_TARGETS" "${args[@]}"

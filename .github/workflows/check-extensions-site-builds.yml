name: Check extensions site builds

on:
  pull_request:
    paths:
      - "catalog/**/releases/**/runtimeconditions.extension.yaml"
      - "catalog/rc/**/*.yaml"
      - "tooling/common/build_extensions_site.py"
      - "tooling/common/serialization.py"
      - "tooling/common/go_bindings.py"
      - "tooling/common/test_*.py"
      - "tooling/extension-bindings/packages.yaml"
      - "bindings/**/go/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install prerequisites
        run: python -m pip install --disable-pip-version-check -r tooling/smithy-runtime-conditions/requirements.txt

      - name: Test site assembly and Go discovery
        run: python -m unittest discover -s tooling/common -p 'test_*.py'

      - name: Build extension definitions and Go discovery pages
        run: python tooling/common/build_extensions_site.py --output _site

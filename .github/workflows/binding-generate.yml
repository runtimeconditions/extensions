name: Generate and commit Go bindings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binding-generate.yml'
      - '.github/actions/binding-tools/**'
      - 'tooling/common/go_bindings.py'
      - 'catalog/**'
      - 'bindings/**/go/**'
      - 'tooling/extension-bindings/packages.yaml'
      - 'tooling/extension-bindings/toolchain.lock.yaml'
      - 'tooling/extension-bindings/model/**'
      - 'tooling/extension-bindings/normalizer/**'
      - 'tooling/extension-bindings/emitters/go/**'
      - 'tooling/extension-bindings/orchestrator/**'
      - 'tooling/extension-bindings/ci/**'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated package-key:go targets, or all; empty uses automatic targets'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: binding-generation-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      INPUT_TARGETS: ${{ inputs.targets || vars.BINDING_GENERATION_TARGETS || 'common-integrations:go,env-configuration:go' }}
      GOTOOLCHAIN: local
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: true

      - name: Prepare shared Go binding tools
        uses: ./.github/actions/binding-tools
        id: tools
        with:
          targets: ${{ env.INPUT_TARGETS }}

      - name: Test generation helper and Go tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tooling/extension-bindings/ci -p 'test_*.py'
          go -C tooling/extension-bindings/normalizer test -count=1 ./...
          go -C tooling/extension-bindings/emitters/go test -count=1 ./...
          go -C tooling/extension-bindings/orchestrator test -count=1 ./...

      - name: Generate and verify Go bindings
        env:
          RC: ${{ steps.tools.outputs.rc }}
          CORE_SCHEMA: ${{ steps.tools.outputs.core-schema }}
        run: |
          python tooling/extension-bindings/ci/generate.py update --targets "$INPUT_TARGETS" \
            --rc "$RC" --core-schema "$CORE_SCHEMA"

      - name: Commit verified generated source to main
        env:
          SOURCE_COMMIT: ${{ steps.tools.outputs.source-commit }}
        run: python tooling/extension-bindings/ci/generate.py commit --targets "$INPUT_TARGETS" --source-commit "$SOURCE_COMMIT"

      - name: Publish updated Go discovery pages through the existing docs build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN }}
          repository: runtimeconditions/runtimeconditions.github.io
          event-type: extensions-updated

name: Extension binding tooling

on:
  pull_request:
    paths:
      - ".github/workflows/extension-binding-normalizer.yml"
      - "catalog/**"
      - "tooling/extension-bindings/IMPLEMENTATION.md"
      - "tooling/extension-bindings/README.md"
      - "tooling/extension-bindings/emitters/go/**"
      - "tooling/extension-bindings/emitters/java/**"
      - "tooling/extension-bindings/emitters/typescript/**"
      - "tooling/extension-bindings/model/**"
      - "tooling/extension-bindings/normalizer/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/extension-binding-normalizer.yml"
      - "catalog/**"
      - "tooling/extension-bindings/IMPLEMENTATION.md"
      - "tooling/extension-bindings/README.md"
      - "tooling/extension-bindings/emitters/go/**"
      - "tooling/extension-bindings/emitters/java/**"
      - "tooling/extension-bindings/emitters/typescript/**"
      - "tooling/extension-bindings/model/**"
      - "tooling/extension-bindings/normalizer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-normalizer:
    name: Verify normalizer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tooling/extension-bindings/normalizer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/extension-bindings/normalizer/go.mod
          cache-dependency-path: tooling/extension-bindings/normalizer/go.sum

      - name: Test normalizer and committed conformance outputs
        run: go test -count=1 ./...

      - name: Vet normalizer
        run: go vet ./...

  verify-go-emitter:
    name: Verify Go emitter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tooling/extension-bindings/emitters/go

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/extension-bindings/emitters/go/go.mod
          cache-dependency-path: |
            tooling/extension-bindings/emitters/go/go.sum
            tooling/extension-bindings/normalizer/go.sum

      - name: Test Go emitter and generated conformance packages
        run: go test -count=1 ./...

      - name: Vet Go emitter
        run: go vet ./...

  verify-typescript-emitter:
    name: Verify TypeScript emitter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tooling/extension-bindings/emitters/typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: tooling/extension-bindings/emitters/typescript/package-lock.json

      - name: Install the pinned emitter dependencies
        run: npm ci --ignore-scripts

      - name: Test the TypeScript emitter and generated conformance packages
        run: npm test

  verify-java-emitter:
    name: Verify Java emitter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tooling/extension-bindings/emitters/java

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21.0.12

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 8.14.2

      - name: Test the Java emitter and generated conformance packages
        run: gradle test --console=plain

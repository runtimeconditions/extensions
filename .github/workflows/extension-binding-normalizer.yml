name: Extension binding tooling

on:
  pull_request:
    paths:
      - ".github/workflows/extension-binding-normalizer.yml"
      - "catalog/**"
      - "tooling/extension-bindings/IMPLEMENTATION.md"
      - "tooling/extension-bindings/README.md"
      - "tooling/extension-bindings/emitters/go/**"
      - "tooling/extension-bindings/emitters/typescript/**"
      - "tooling/extension-bindings/emitters/rust/**"
      - "tooling/extension-bindings/model/**"
      - "tooling/extension-bindings/normalizer/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/extension-binding-normalizer.yml"
      - "catalog/**"
      - "tooling/extension-bindings/IMPLEMENTATION.md"
      - "tooling/extension-bindings/README.md"
      - "tooling/extension-bindings/emitters/go/**"
      - "tooling/extension-bindings/emitters/typescript/**"
      - "tooling/extension-bindings/emitters/rust/**"
      - "tooling/extension-bindings/model/**"
      - "tooling/extension-bindings/normalizer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-normalizer:
    name: Verify normalizer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tooling/extension-bindings/normalizer

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tooling/extension-bindings/normalizer/go.mod
          cache-dependency-path: tooling/extension-bindings/normalizer/go.sum

      - name: Test normalizer and committed conformance outputs
        run: go test -count=1 ./...

      - name: Vet normalizer
        run: go vet ./...

  verify-go-emitter:
    name: Verify Go emitter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tooling/extension-bindings/emitters/go

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tooling/extension-bindings/emitters/go/go.mod
          cache-dependency-path: |
            tooling/extension-bindings/emitters/go/go.sum
            tooling/extension-bindings/normalizer/go.sum

      - name: Test Go emitter and generated conformance packages
        run: go test -count=1 ./...

      - name: Vet Go emitter
        run: go vet ./...

  verify-typescript-emitter:
    name: Verify TypeScript emitter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tooling/extension-bindings/emitters/typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: tooling/extension-bindings/emitters/typescript/package-lock.json

      - name: Install the pinned emitter dependencies
        run: npm ci --ignore-scripts

      - name: Test the TypeScript emitter and generated conformance packages
        run: npm test

  verify-rust-emitter:
    name: Verify Rust emitter on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: tooling/extension-bindings/emitters/rust

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt && rustup default 1.92.0

      - name: Test the Rust emitter and generated conformance packages
        run: cargo test --locked

      - name: Lint Rust emitter
        run: cargo clippy --locked -- -D warnings

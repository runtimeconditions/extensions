name: Extension binding tooling

on:
  pull_request:
    paths:
      - ".github/workflows/extension-binding-normalizer.yml"
      - "catalog/**"
      - "tooling/extension-bindings/IMPLEMENTATION.md"
      - "tooling/extension-bindings/README.md"
      - "tooling/extension-bindings/emitters/go/**"
      - "tooling/extension-bindings/emitters/typescript/**"
      - "tooling/extension-bindings/emitters/python/**"
      - "tooling/extension-bindings/ci/emitter_conformance.py"
      - "tooling/extension-bindings/model/**"
      - "tooling/extension-bindings/normalizer/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/extension-binding-normalizer.yml"
      - "catalog/**"
      - "tooling/extension-bindings/IMPLEMENTATION.md"
      - "tooling/extension-bindings/README.md"
      - "tooling/extension-bindings/emitters/go/**"
      - "tooling/extension-bindings/emitters/typescript/**"
      - "tooling/extension-bindings/emitters/python/**"
      - "tooling/extension-bindings/ci/emitter_conformance.py"
      - "tooling/extension-bindings/model/**"
      - "tooling/extension-bindings/normalizer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-normalizer:
    name: Verify normalizer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tooling/extension-bindings/normalizer

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tooling/extension-bindings/normalizer/go.mod
          cache-dependency-path: tooling/extension-bindings/normalizer/go.sum

      - name: Test normalizer and committed conformance outputs
        run: go test -count=1 ./...

      - name: Vet normalizer
        run: go vet ./...

  verify-go-emitter:
    name: Verify Go emitter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tooling/extension-bindings/emitters/go

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tooling/extension-bindings/emitters/go/go.mod
          cache-dependency-path: |
            tooling/extension-bindings/emitters/go/go.sum
            tooling/extension-bindings/normalizer/go.sum

      - name: Test Go emitter and generated conformance packages
        run: go test -count=1 ./...

      - name: Vet Go emitter
        run: go vet ./...

  verify-typescript-emitter:
    name: Verify TypeScript emitter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tooling/extension-bindings/emitters/typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: tooling/extension-bindings/emitters/typescript/package-lock.json

      - name: Install the pinned emitter dependencies
        run: npm ci --ignore-scripts

      - name: Test the TypeScript emitter and generated conformance packages
        run: npm test

  verify-emitter-conformance:
    name: Verify emitters agree on the shared fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'

      - name: Install the pinned Python tooling
        run: python -m pip install --disable-pip-version-check --no-deps -r tooling/extension-bindings/ci/python-tooling-requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: tooling/extension-bindings/emitters/typescript/package-lock.json

      - name: Build the TypeScript emitter
        working-directory: tooling/extension-bindings/emitters/typescript
        run: npm ci --ignore-scripts && npm run build

      - name: Test the fixture checker
        working-directory: tooling/extension-bindings/ci
        run: python -m unittest test_emitter_conformance

      - name: Compare each emitter's manifest with the shared fixtures
        working-directory: tooling/extension-bindings/ci
        run: python emitter_conformance.py --emitters python,typescript

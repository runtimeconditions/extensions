apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition
metadata:
  id: https://runtimeconditions.io/go-fixture/value-member-collision:1.0.0
  version: 1.0.0
spec:
  kinds:
    - name: service
  conditionFields:
    - name: mode
      appliesToKinds: [service]
  schemas:
    - id: service
      description: Distinct exact values that derive the same Go enum member.
      appliesToKind: service
      schema:
        type: object
        properties:
          mode:
            type: string
            enum: [apiUrl, api_url]
        additionalProperties: false

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://runtimeconditions.io/schemas/java-package-target/v1alpha1
title: Runtime Conditions Java package target
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
  - packageKey
  - rootExtension
  - groupId
  - artifactId
  - javaPackage
  - version
  - sourceDirectory
  - minimumJavaVersion
  - publicationMode
  - repositoryUrl
properties:
  apiVersion:
    const: runtimeconditions.io/java-package-target/v1alpha1
  kind:
    const: RuntimeConditionsJavaPackageTarget
  packageKey:
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  rootExtension:
    type: string
    minLength: 1
  groupId:
    description: The Maven groupId.
    type: string
    maxLength: 128
    pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$'
  artifactId:
    description: The Maven artifactId.
    type: string
    maxLength: 128
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  javaPackage:
    description: The Java package every generated type is declared in. It is never inferred from extension vocabulary.
    type: string
    pattern: '^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)*$'
  version:
    type: string
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
  sourceDirectory:
    type: string
    pattern: '^bindings/[a-z0-9]+(?:-[a-z0-9]+)*/java$'
  minimumJavaVersion:
    type: string
    pattern: '^(?:1[7-9]|[2-9][0-9]|[1-9][0-9]{2,})$'
  publicationMode:
    enum: [github-tag, registry]
  registryId:
    type: string
    minLength: 1
  repositoryUrl:
    type: string
    pattern: '^https://[^\s]+$'
  emitterSha256:
    description: Required when emitting package resources; supplied by the tooling caller.
    type: string
    pattern: '^[0-9a-f]{64}$'
  dependencies:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [extension, groupId, artifactId, javaPackage, version]
      properties:
        extension:
          type: string
          minLength: 1
        groupId:
          type: string
          maxLength: 128
          pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$'
        artifactId:
          type: string
          maxLength: 128
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        javaPackage:
          type: string
          pattern: '^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)*$'
        version:
          type: string
          pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
        versionRange:
          description: A Maven version range for this dependency. When absent, the range from the declared version up to the next breaking version is used.
          type: string
          minLength: 1
allOf:
  - if:
      properties:
        publicationMode:
          const: registry
    then:
      required: [registryId]
    else:
      not:
        required: [registryId]

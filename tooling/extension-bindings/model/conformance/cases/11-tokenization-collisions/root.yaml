apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition
metadata:
  id: urn:runtimeconditions:conformance:tokenization-collisions
  version: 1.0.0
spec:
  kinds:
    - name: class
  interfaceTypes:
    - name: HTTPServer2URL
      targetKind: class
  conditionFields:
    - name: 9patch
      appliesToKinds: [class]
      appliesToInterfaceTypes: [HTTPServer2URL]
    - name: café
      appliesToKinds: [class]
      appliesToInterfaceTypes: [HTTPServer2URL]
    - name: api_url
      appliesToKinds: [class]
      appliesToInterfaceTypes: [HTTPServer2URL]
  schemas:
    - id: tokenization
      description: Portable tokenizer inputs and normalized-name collisions.
      appliesToKind: class
      appliesToInterfaceType: HTTPServer2URL
      schema:
        type: object
        properties:
          9patch: {type: string}
          café: {type: string}
          api_url: {type: string}
        additionalProperties: false

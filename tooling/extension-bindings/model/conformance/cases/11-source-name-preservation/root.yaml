apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition
metadata:
  id: urn:runtimeconditions:conformance:source-name-preservation
  version: 1.0.0
spec:
  kinds:
    - name: class
  interfaceTypes:
    - name: http_server2_url
      targetKind: class
  conditionFields:
    - name: patch9
      appliesToKinds: [class]
      appliesToInterfaceTypes: [http_server2_url]
    - name: café
      appliesToKinds: [class]
      appliesToInterfaceTypes: [http_server2_url]
    - name: api_url
      appliesToKinds: [class]
      appliesToInterfaceTypes: [http_server2_url]
  schemas:
    - id: source-names
      description: Exact source names retained for emitter-specific naming.
      appliesToKind: class
      appliesToInterfaceType: http_server2_url
      schema:
        type: object
        properties:
          patch9: {type: string}
          café: {type: string}
          api_url: {type: string}
        additionalProperties: false

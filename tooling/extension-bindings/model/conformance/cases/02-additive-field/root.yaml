apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition
metadata:
  id: https://runtimeconditions.io/conformance/additive-field:1.0.0
  version: 1.0.0
spec:
  dependencies:
    - https://runtimeconditions.io/conformance/additive-field-base:1.0.0
  conditionFields:
    - name: credential
      appliesToKinds: [service]
      appliesToInterfaceTypes: [http]
  schemas:
    - id: additive-credential
      description: Additive credential structure.
      appliesToKind: service
      appliesToInterfaceType: http
      schema:
        type: object
        properties:
          credential:
            type: object
            required: [token]
            properties:
              token:
                type: string
            additionalProperties: false
        additionalProperties: true

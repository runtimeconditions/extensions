apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition
metadata:
  id: urn:runtimeconditions:conformance:additive-field:base
  version: 1.0.0
spec:
  kinds:
    - name: service
  interfaceTypes:
    - name: http
      targetKind: service
  schemas:
    - id: base-service-http
      description: Base service HTTP structure.
      appliesToKind: service
      appliesToInterfaceType: http
      schema:
        type: object
        properties:
          kind:
            const: service
          interface:
            type: object
            properties:
              type:
                const: http
            additionalProperties: false
        additionalProperties: true
